<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Buddy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="app-container">

        <header>
            <div class="header-eyebrow">
                <span class="dot"></span>
                <span>AI Code Generator</span>
            </div>
            <h1>Coding Buddy <span class="title-accent">💖</span></h1>
            <p>Describe what you want built — get a live preview instantly.</p>
        </header>

        <div class="main-layout">

            <div class="input-section">
                <div class="input-label">
                    <span class="label-icon">✦</span>
                    Your Prompt
                </div>
                <textarea id="prompt" placeholder="e.g., Create a beautiful landing page for a coffee shop..."></textarea>
                <div class="btn-group">
                    <button onclick="generateCode()" id="genBtn">
                        <span class="btn-icon">⚡</span>
                        Generate & Preview
                    </button>
                    <button onclick="downloadCode()" id="downBtn" disabled>
                        <span class="btn-icon">↓</span>
                        Download .zip
                    </button>
                </div>

                <div class="file-list-wrapper">
                    <div class="file-list-label">Generated Files</div>
                    <div id="file-list"></div>
                </div>
            </div>

            <div class="preview-section">
                <div class="preview-header">
                    <div class="preview-dots">
                        <span></span><span></span><span></span>
                    </div>
                    <span class="preview-title">Live Preview</span>
                    <div class="preview-badge">Sandboxed</div>
                </div>
                <iframe id="preview-frame" sandbox="allow-scripts"></iframe>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
